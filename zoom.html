<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zoom Workplace</title>
    <style>
        body {
            background-color: blue;
            width: 100%;
            height: 90%;
            margin-top: 20px;
            margin-left: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        #div1 {
            background-color: blue;
            color: white;
        }

        #h1 {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 50px;
        }

        #h2 {     
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 50px;
        }

        fieldset {
            height: 450px;
            justify-content: center;   
            align-items: center;  
            max-width: 100%;
            border-radius: 15px;   
            color: white;
            background-color: rgb(22, 21, 21)
        }
        #h3 {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 30px;
        }

        #h4 {
            font-size: 20px;
            font-family:Verdana, Geneva, Tahoma, sans-serif 'Arial Narrow', Arial, sans-serif;
        }

        #button1 {
            width: 100%;
            padding: 15px;
            color: white;
            background-color: blue;
            border: none;
            font-weight: bold;
            border-radius: 20px;
            font-size: 20px;
        }

        #button2 {
            width: 100%;
            padding: 15px;
            color: blue;
            background-color: rgb(23, 22, 22);
            border-radius: 20px;
            font-weight: bold;
            font-size: 20px;
            box-sizing: border-box;
            border: 1px solid #555;
        }

        #button3 {
            width: 100%;
            padding: 15px;
            color: blue;
            background-color: rgb(16, 16, 16);
            border-radius: 20px;
            font-weight: bold;
            font-size: 20px;
            box-sizing: border-box;
            border: 1px solid #555;
        }
    </style>
</head>

<body>
    <center>
        <div id="div1">
            <h2 id="h1">zoom</h2>
            <h2 id="h2">Workplace</h2>
        </div>
        <form>
            <fieldset>
                <h3 id="h3">Welcome</h3>
                <h4 id="h4">Get started with your account</h4>
                <button id="button1">Sign in</button><br><br>
                <button id="button2">Sign up</button><br><br>
                <button id="button3">Join a meeting</button>
            </fieldset>
        </form>
    </center>
</body>

</html>
