<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Independence Day - 15 August</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            color: #fff;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        p {
            color: #f0f0f0;
            font-size: 1.2rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Flag Pole */
        .flag-pole {
            width: 10px;
            height: 350px;
            background: linear-gradient(90deg, #777, #ccc, #777);
            position: relative;
            margin: 0 auto;
            border-radius: 5px;
        }

        /* Flag Styling */
        .flag {
            width: 300px;
            height: 200px;
            position: absolute;
            top: 10px;
            left: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: wave 4s ease-in-out infinite;
            transform-origin: left center;
        }

        .stripe {
            height: 33.33%;
            width: 100%;
        }

        .saffron {
            background-color: #FF9933;
        }

        .white {
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .green {
            background-color: #138808;
        }

        /* Ashoka Chakra */
        .chakra {
            width: 50px;
            height: 50px;
            border: 2px solid #000080;
            border-radius: 50%;
            position: relative;
            animation: rotateChakra 10s linear infinite;
        }

        .chakra .line {
            position: absolute;
            background-color: #000080;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
        }

        .chakra .line:nth-child(1) { transform: rotate(0deg); }
        .chakra .line:nth-child(2) { transform: rotate(15deg); }
        .chakra .line:nth-child(3) { transform: rotate(30deg); }
        .chakra .line:nth-child(4) { transform: rotate(45deg); }
        .chakra .line:nth-child(5) { transform: rotate(60deg); }
        .chakra .line:nth-child(6) { transform: rotate(75deg); }
        .chakra .line:nth-child(7) { transform: rotate(90deg); }
        .chakra .line:nth-child(8) { transform: rotate(105deg); }
        .chakra .line:nth-child(9) { transform: rotate(120deg); }
        .chakra .line:nth-child(10) { transform: rotate(135deg); }
        .chakra .line:nth-child(11) { transform: rotate(150deg); }
        .chakra .line:nth-child(12) { transform: rotate(165deg); }

        /* Animations */
        @keyframes wave {
            0%, 100% {
                transform: rotateX(0deg) rotateY(0deg);
            }
            50% {
                transform: rotateX(10deg) rotateY(-15deg);
            }
        }

        @keyframes rotateChakra {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-text {
            margin-top: 40px;
            color: #ffdf00;
            font-weight: bold;
            font-size: 1.5rem;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Independence Day!</h1>
        <p>Proud to be an Indian. Jai Hind! 🇮🇳</p>

        <div class="flag-pole">
            <div class="flag">
                <div class="stripe saffron"></div>
                <div class="stripe white">
                    <div class="chakra">
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                </div>
                <div class="stripe green"></div>
            </div>
        </div>

        <div class="footer-text">&copy; 2026, 15th August - India</div>
    </div>

</body>
</html>
